services:
  # ============================================================================
  # Full-Stack Web Service (Fastify HTTP + WebSockets + React Canvas UI)
  # ============================================================================
  - type: web
    name: whiteboard-app
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm -r build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TICKET_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: whiteboard-db
    plan: free
    databaseName: whiteboard
    user: postgres
