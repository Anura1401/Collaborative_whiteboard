services:
  # ============================================================================
  # 1. Backend Web Service (Fastify + WebSockets)
  # ============================================================================
  - type: web
    name: whiteboard-server
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm -r build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TICKET_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString

  # ============================================================================
  # 2. Frontend Static Site (React 19 + Canvas)
  # ============================================================================
  - type: web
    name: whiteboard-web
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm --filter @whiteboard/shared build && pnpm --filter @whiteboard/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: whiteboard-server
          property: host
          # Will inject https://whiteboard-server.onrender.com

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: whiteboard-db
    plan: free
    databaseName: whiteboard
    user: postgres
