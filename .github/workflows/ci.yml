name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: whiteboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Property Tests
        run: pnpm test

      - name: Run Migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/whiteboard

      - name: Integration Tests
        run: pnpm test:int
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/whiteboard

      - name: Build
        run: pnpm build
