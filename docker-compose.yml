services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whiteboard-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/whiteboard
      - TICKET_SECRET=production-secret-signing-key-for-tickets-32bytes!
      - ALLOWED_ORIGINS=*
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: whiteboard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
